<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Környezettechnika</title>
<style>
:root {
  --bg: #F2F6F7;
  --surface: #FFFFFF;
  --ink: #102A30;
  --muted: #566D74;
  --line: #D3DFE2;
  --accent: #0B7A85;
  --accent-soft: #E1F1F3;
  --hard: #B3392F;
  --hard-soft: #FBE9E7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1A1E;
    --surface: #14272C;
    --ink: #E6F0F2;
    --muted: #9BB3B9;
    --line: #27424A;
    --accent: #4FC3CF;
    --accent-soft: #163840;
    --hard: #FF8A7F;
    --hard-soft: #3A1E1B;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
}
main { width: 100%; max-width: 720px; }
h1 { margin: 0 0 4px; font-size: 1.75rem; }
.sub { margin: 0 0 24px; color: var(--muted); }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
a.card {
  display: block;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--accent);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
  transition: transform .12s, box-shadow .12s;
}
a.card.hard { border-left-color: var(--hard); }
a.card:hover, a.card:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
  outline: none;
}
a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .8rem;
  font-weight: 600;
}
.hard .tag { background: var(--hard-soft); color: var(--hard); }
.card h2 { margin: 10px 0 6px; font-size: 1.25rem; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Környezettechnika</h1>
  <p class="sub">Válaszd ki, melyik gyakorlót szeretnéd megnyitni.</p>
  <div class="grid">
    <a class="card" href="Ko%CC%88rnyezettechnika-teszt.html">
      <span class="tag">Alap</span>
      <h2>Teszt</h2>
      <p>Környezettechnika gyakorló teszt.</p>
    </a>
    <a class="card hard" href="Ko%CC%88rnyezettechnika-hardcore.html">
      <span class="tag">Hardcore</span>
      <h2>ZH-gyakorló</h2>
      <p>Bővebb, nehezebb ZH-gyakorló kérdéssor.</p>
    </a>
  </div>
</main>
</body>
</html>
