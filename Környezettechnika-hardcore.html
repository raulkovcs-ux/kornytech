<title>Környezettechnika ZH-gyakorló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: egyoszlopos „műszerfal": felső fülsor, alatta kártyák; mobilon egymás alá. */
:root{
  --bg:#f1f4f0; --surface:#ffffff; --surface2:#e8ede8; --fg:#13211c; --muted:#5a6b64; --line:#cfd9d2;
  --accent:#0b6b5c; --accent-fg:#ffffff; --accent-soft:#d6ebe5;
  --amber:#b87503; --amber-soft:#f8e9c8;
  --good:#1d7a45; --good-soft:#d5efdf; --bad:#b3372c; --bad-soft:#f6dcd8;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1613; --surface:#16211d; --surface2:#1d2b26; --fg:#e4eee9; --muted:#9bb0a6; --line:#2c3d36;
  --accent:#43c4ab; --accent-fg:#06201a; --accent-soft:#17352e;
  --amber:#e3a63a; --amber-soft:#3a2d10;
  --good:#52c883; --good-soft:#143323; --bad:#ef7d70; --bad-soft:#3b1b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1613; --surface:#16211d; --surface2:#1d2b26; --fg:#e4eee9; --muted:#9bb0a6; --line:#2c3d36;
  --accent:#43c4ab; --accent-fg:#06201a; --accent-soft:#17352e;
  --amber:#e3a63a; --amber-soft:#3a2d10;
  --good:#52c883; --good-soft:#143323; --bad:#ef7d70; --bad-soft:#3b1b17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 0}
.top-in{max-width:860px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.brand{font:700 22px/1 var(--f-head);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;padding-block:4px}
.brand small{font:500 13px var(--f-mono);color:var(--muted);letter-spacing:0;text-transform:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.theme-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted);font-size:13px}
main{padding-top:20px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-head);letter-spacing:.02em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:700}
h2{font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:19px;font-weight:600}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.modes{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.modes{grid-template-columns:1fr}.brand{order:1}.theme-btn{order:2;margin-left:auto}nav.tabs{order:3;flex-basis:100%}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:11px 18px;font-weight:700;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;width:100%}
.mode:hover{border-color:var(--accent)}
.mode.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mode.primary .sub{color:inherit;opacity:.88}
.mode .t{font:600 21px/1.1 var(--f-head);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--muted);font-size:14.5px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{border-left:3px solid var(--accent);padding-left:10px}
.stat b{display:block;font:600 30px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)} .bar .l{background:var(--amber)}
.topics{display:flex;flex-direction:column;gap:12px}
.topic-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:8px 14px;align-items:center}
.topic-row .nm{font-weight:600;min-width:0}
.topic-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
@media (max-width:560px){.topic-row{grid-template-columns:1fr auto}.topic-row .bar{grid-column:1/-1;order:3}}
.chip{display:inline-block;font:600 12px var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);letter-spacing:.02em}
.chip.zh{background:var(--amber-soft);color:var(--amber)}
.countdown{display:flex;flex-wrap:wrap;gap:12px 28px}
.cd b{font:700 38px/1 var(--f-head);color:var(--amber)}
.cd span{display:block;font-size:13px;color:var(--muted)}
/* kérdés */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:20px;line-height:1.35;font-weight:600;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font:600 15px var(--f-mono);display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:15.5px}
.expl.bad{border-color:var(--bad);background:var(--bad-soft)}
.expl.good{border-color:var(--good);background:var(--good-soft)}
.expl b.v{display:block;font:700 13px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qgrid button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--f-mono)}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--fg)}
.result-big{display:flex;flex-wrap:wrap;align-items:center;gap:6px 28px}
.grade{font:700 88px/1 var(--f-head);color:var(--accent)}
.grade.bad{color:var(--bad)}
.pct{font:600 40px var(--f-mono)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.cheat{display:flex;flex-direction:column;gap:14px}
.cheat details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cheat summary{cursor:pointer;padding:14px 16px;font:600 20px var(--f-head);text-transform:uppercase;letter-spacing:.05em;list-style:none;display:flex;justify-content:space-between;gap:10px}
.cheat summary::after{content:"+";font-family:var(--f-mono)}
.cheat details[open] summary::after{content:"–"}
.cheat .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.cheat ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.cheat .tip{background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:15px}
.review-item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ans-line{font-size:15px}
.ans-line b{font-weight:700}
.sel-row{display:flex;flex-wrap:wrap;gap:8px}
select{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.empty{color:var(--muted);font-style:italic}
.note{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand">KT ZH-gyakorló <small id="qcount"></small></div>

</div></header>

<script>
/* Kérdésbank 1/2: előadás 1-2 (T1-T4). Q(téma, kérdés, HELYES, rossz1, rossz2, rossz3, magyarázat, tanári-példa?) */
const Q=(t,q,a,b,c,d,e,z)=>({t,q,o:[a,b,c,d],e,z:z?1:0});
const BANK=[];
const add=(...x)=>x.forEach(i=>BANK.push(i));

/* ===== T1: Bevezetés, környezetvédelem története ===== */
add(
Q("tort","Mi a bioakkumuláció?","A környezetbe került szerves vagy szervetlen anyagok (pl. DDT, nehézfémek) felhalmozódása az élő szervezetekben; a táplálékláncon felfelé haladva a koncentráció tovább nő (biomagnifikáció)","A szennyezőanyagok lebomlása a talajban a mikroorganizmusok hatására","A víz tápanyagtartalmának (N, P) megnövekedése, ami elalgásodáshoz vezet","A légköri szennyezők kimosódása a csapadékkal","Bioakkumuláció: felhalmozódás az élőlényekben → a tápláléklánc mentén feldúsulás = biomagnifikáció (DDT, Hg, nehézfémek, cianidok).",1),
Q("tort","Melyik elemhez kötődik a Minamata-kór?","Higany (Hg)","Ólom (Pb)","Kadmium (Cd)","Arzén (As)","Minamata-kór = higanymérgezés okozta neurológiai betegség (Japán, Minamata, 1956). Az épp a metil-higany halakban, kagylókban halmozódott fel.",1),
Q("tort","Mi történt a vegyi üzemből a tengerbe jutó higannyal Minamatában?","Baktériumok metil-higannyá alakították, ami felhalmozódott a halakban és kagylókban, onnan az emberekbe jutott","A tengervíz kloridjai oldható komplexet képeztek vele, így nem jutott a táplálékláncba","Üledékben ásványosodott, ezért nem került az élőlényekbe","Elpárolgott a légkörbe, és onnan savas esővel jutott vissza","Az eredetileg szervetlen higanyt a baktériumok metil-higannyá alakították → bioakkumuláció → biomagnifikáció.",0),
Q("tort","Melyik állítás igaz a Minamata-kórra?","Higanymérgezés okozta neurológiai betegség; terhes nők esetén a magzatnál veleszületett kórt is okozhat","Kadmium okozta csontlágyulással járó betegség","Perzisztens peszticidek okozta májelégtelenség","Ólomtartalmú festékek okozta fejlődési zavar","Tünetek: fejfájás, izomrángás, zsibbadás, hallás- és látásvesztés, mozgáskoordinációs zavar, bénulás, kóma; magzatnál fejlődési rendellenesség.",1),
Q("tort","Melyik NEM igaz a DDT-re?","Gyorsan lebomló, rövid hatású szer, ezért nem halmozódik fel a környezetben","Széles spektrumú, perzisztens, erős növényvédő szer","Felhasználását elsőként Magyarországon tiltották be, 1968-ban","Az USA-ban 1972-re betiltották","A DDT PERZISZTENS (nehezen bomlik), ezért bioakkumulálódik. Magyarország tiltotta be elsőként (1968), USA: 1972.",1),
Q("tort","Mikor és hol tiltották be elsőként a DDT használatát?","1968-ban Magyarországon","1972-ben az USA-ban","1962-ben az Egyesült Királyságban","1987-ben Japánban","Első betiltás: Magyarország, 1968. Az USA 1972-re követte (Carson hatására).",0),
Q("tort","Ki írta a „Néma tavasz” című könyvet (1962)?","Rachel Carson (amerikai tengerbiológus, író)","Gro Harlem Brundtland","Denis Hayes","Frederic Vester","Carson a növényvédő szerek esztelen használatának hatásait mutatta be. Innentől számítjuk a globális zöldmozgalom kezdetét.",0),
Q("tort","Mihez kötjük a globális zöldmozgalom kezdetét?","Rachel Carson: Néma tavasz (1962)","Az ENSZ megalakulása (1945)","A Kiotói jegyzőkönyv (1997)","A Montreali Egyezmény (1987)","1962: Néma tavasz → Kennedy vizsgálóbizottság → 1972-re DDT-tilalom az USA-ban.",0),
Q("tort","Melyik volt az első zárt szennyvízcsatorna?","A Kr.e. 5. századi római Cloaca Maxima","A londoni csatornahálózat (XIV. század)","Karthágó csatornarendszere (Kr.e. 3. sz.)","A párizsi csatornák (XIX. sz.)","Cloaca Maxima, Róma: a szennyvizet és az esővizet a Tiberisbe vezette.",0),
Q("tort","Mit tiltott meg I. Edward angol király 1306-ban Londonban?","A kőszén égetését (sikertelenül)","A folyókba történő szennyvízbevezetést","Az erdők kivágását a nemesek vadászterületein","A fémek olvasztását a városban","Londonban csak 1952-ben alakult ki a híres londoni (téli) szmog – smoke + fog = smog.",0),
Q("tort","Melyik állítás igaz a K-stratégistákra?","Hosszú életűek, magas túlélési arányúak, kis populációnövekedési rátájúak; a populáció az eltartóképesség közelében stabilizálódik (pl. nagy testű emlősök)","Rövid életűek, gyors fejlődésűek, nagy szaporodási rátájúak","A populáció mérete gyakran túlnő az eltartóképességen","A hirtelen felszabaduló források gyors kihasználására specializálódtak","A K-stratégisták a stabil, S-alakú növekedést mutató fajok; az r-stratégisták a J-alakú, gyors szaporodásúak.",0),
Q("tort","Melyik jellemző az r-stratégistákra?","Rövid életű, gyors fejlődésű, nagy növekedési rátájú; a hirtelen felszabaduló források gyors kihasználására alkalmas","Késői ivarérés, kis populációnövekedési ráta","Tartós gazdálkodás a forrásokkal","Stabil populációméret az eltartóképesség határán","r = gyors szaporodás (J-alakú görbe), K = eltartóképesség közelében stabilizálódás (S-alakú).",0),
Q("tort","Mely szervezet megbízásából készült „A növekedés határai” (1972) című tanulmány (Meadows-modell)?","A Római Klub megbízásából az MIT-n","Az ENSZ Környezeti Programja (UNEP) megbízásából a Stockholmi Egyetemen","A Brundtland Bizottság megbízásából","A Greenpeace megbízásából","A modell szerint a korabeli tendenciák nem tarthatók fenn az emberiség létének veszélyeztetése nélkül.",0),
Q("tort","Mit állított Frederic Vester (1982) az életben maradás programjában?","Az 1970-es évek átlagos amerikai fogyasztása mellett a Föld mindössze kb. 2 milliárd embert tudna eltartani","A Föld akár 20 milliárd embert is eltartana, ha a mezőgazdaság iparosodik","A népességrobbanás magától megáll 6 milliárd fő körül","Az olaj elfogyása 2000-re leállítja a gazdasági növekedést","Vester: a fogyasztási szint határozza meg az eltartóképességet.",0),
Q("tort","Mi volt az 1970. április 22-i esemény?","Az első „Föld Napja” (Denis Hayes kezdeményezésére, 20 millió amerikai részvételével)","A Stockholmi Világkonferencia megnyitója","A Brundtland-jelentés kiadása","Az Agenda 21 elfogadása","Az USA-ban ezután törvények születtek a levegő és a vizek védelmére, új környezetvédő szervezetek alakultak.",0),
Q("tort","Mi történt 1972-ben Stockholmban?","ENSZ 1. Környezetvédelmi Világkonferencia: létrehozták az UNEP-et, június 5. lett a Környezetvédelmi Világnap, elfogadták a Stockholmi Nyilatkozatot","Elfogadták az Agenda 21-et és megnyitották aláírásra az éghajlat-változási keretegyezményt","Aláírták a Kiotói jegyzőkönyvet","Megszületett a párizsi éghajlatváltozási egyezmény","Stockholm 1972: 113 ország, az emberhez méltó környezethez való jog nemzetközi elismerése.",0),
Q("tort","Melyik dokumentum fogalmazta meg elsőként a fenntartható fejlődés fogalmát?","A Brundtland Bizottság „Közös Jövőnk” jelentése (1987)","A Stockholmi Nyilatkozat (1972)","A Kiotói jegyzőkönyv (1997)","A „Néma tavasz” (1962)","A Környezet és Fejlődés Világbizottságot (1984) Gro Harlem Brundtland (norvég miniszterelnök) vezette.",0),
Q("tort","Melyik a fenntartható fejlődés helyes definíciója?","Olyan fejlődés, amely kielégíti a jelen szükségleteit anélkül, hogy lehetetlenné tenné a jövő generációk szükségleteinek kielégítését","Olyan gazdasági fejlődés, amely a környezetvédelmi költségeket a nullára csökkenti","Zéró gazdasági növekedés a természeti erőforrások megóvása érdekében","A fejlődés, amely a megújuló energiaforrásokra épül, és a nem megújulókat teljesen kizárja","Közös Jövőnk, 1987. A zéró növekedést a tanulmányok nem tartották elfogadhatónak.",1),
Q("tort","Az alábbiak közül melyik NEM igaz a fenntartható fejlődésre?","A megújuló erőforrások felhasználása meghaladhatja a regenerálódási képességüket, ha ez a gazdasági növekedéshez szükséges","A megújuló erőforrások felhasználásának mértéke legfeljebb a regenerálódó képességükkel egyezhet meg","A hulladék keletkezésének mértéke legfeljebb a környezet befogadó/ártalmatlanító képességével egyezhet meg","A kimerülő erőforrások felhasználási ütemét a megújulókkal való helyettesíthetőség és a technológiai haladás határozza meg","Követelmények: megújulók ≤ regeneráció; kimerülők ésszerű üteme; hulladék ≤ befogadó képesség.",1),

add(
Q("alap","Mit jelent a környezetszennyezés?","Az emberi tevékenység eredményeként valamilyen anyag (vagy rezgés, hő, zaj) közvetlen vagy közvetett kibocsátása a levegőbe, talajba vagy vízbe, ami veszélyt jelenthet az emberi egészségre vagy a környezet minőségére","Bármilyen természetes eredetű anyag megjelenése a környezetben","Kizárólag a veszélyes hulladékok illegális lerakása","Csak a levegőbe kibocsátott szilárd részecskék jelenléte","A definícióban benne van a hő, a zaj és a rezgés is.",0),
Q("alap","Melyik sor írja le helyesen az EMISSZIÓT?","Adott káros anyag kibocsátása a forrásból (pont-, épület- vagy felületi forrásból), mértékegysége pl. g/óra","A szennyező anyag terjedése, eloszlása, felhígulása a levegőben","A levegőben kialakult szennyezőanyag-koncentráció (levegőterheltségi szint), pl. µg/m³","A szennyező anyag kémiai átalakulása a légkörben","Emisszió = kibocsátás (forrás oldal).",1),
Q("alap","Melyik sor írja le helyesen az IMMISSZIÓT?","A levegőterheltségi szint: a levegőben kialakult szennyezőanyag (gázok, aeroszolok) koncentrációja, mértékegysége pl. g/m³ vagy µg/m³","Adott káros anyag kibocsátása a forrásból, mértékegysége g/óra","A szennyező anyag terjedése és felhígulása","A kibocsátási határérték betartásának ellenőrzése","Immisszió = a levegő minőségét jellemző koncentráció (hatás oldal).",1),
Q("alap","Melyik sor írja le helyesen a TRANSZMISSZIÓT?","Az adott szennyező anyag terjedése, eloszlása, felhígulása","A szennyező anyag kibocsátása a kéményből","A szennyező anyag koncentrációja a levegőben a befogadónál","A szennyező anyag leválasztása a füstgázból","Emisszió → transzmisszió → immisszió: kibocsátás → terjedés → levegőterheltség.",1),

Q("alap","Mi a környezetszennyezés csökkentésének leghatékonyabb módja a felsoroltak közül?","A forrás megszüntetése (hulladékszegény/hulladékmentes technológia)","A „cső végi” kibocsátás elkülönítése és ártalmatlanítása","A környezetbe került szennyezők utólagos ártalmatlanítása","A határérték hígítással való betartása","Sorrend: forrás megszüntetése > emisszió szabályozása (cső végén) > immisszió utólagos kezelése. A hígítással való teljesítés határérték-túllépés!",0),

    out.push(items[k].q);items.splice(k,1);
  }
  return out;
}
function wt(q){const s=stat0(q);let w;
  if(!s||s.seen===0)w=3;else if(s.box===0)w=4.5;else if(s.box===1)w=2;else if(s.box===2)w=0.9;else w=0.25;
  return w*(q.z?1.35:1)}
const prep=q=>({q,order:shuffle([0,1,2,3]),ans:null,retry:false});

/* ===== indítás ===== */
function start(mode,t){
  let pool=[],feedback=true,title="",deadline=null;
  if(mode==="practice"){pool=weighted(BANK,10);title="Okos gyakorlás"}
  else if(mode==="zh"){const zq=BANK.filter(q=>q.z);pool=weighted(zq,Math.min(20,zq.length));title="Tanári példatípusok"}
  else if(mode==="errors"){const w=BANK.filter(isWeak);w.sort((a,b)=>(stat0(b).last||0)-(stat0(a).last||0));pool=shuffle(w.slice(0,15));title="Hibanapló"}
  else if(mode==="topic"){const qs=BANK.filter(q=>q.t===t);const pend=qs.filter(q=>!isMastered(q));pool=shuffle(pend.length?pend:qs);title=TMAP[t].n}
  else if(mode==="sim"){
    const n=simN;pool=simPick(n);feedback=false;title="ZH-szimuláció";deadline=Date.now()+n*60000;
  }
  if(!pool.length){S=null;alert_empty();return}
  S={mode,title,feedback,items:pool.map(prep),idx:0,start:Date.now(),deadline,done:false,retried:{}};
  tab="home";setView("quiz");
  if(deadline){timerId=setInterval(tick,1000)}
}
function alert_empty(){const el=$("#app");el.insertAdjacentHTML("afterbegin",`<div class="expl bad" role="alert">Ebben a módban most nincs kérdés. Kezdj egy okos gyakorlással, és a hibáid ide kerülnek.</div>`)}
function simPick(n){
  const per={};TOPICS.forEach(t=>per[t.id]=BANK.filter(q=>q.t===t.id));
  const tot=BANK.length;let out=[];
  TOPICS.forEach(t=>{const k=Math.max(1,Math.round(n*per[t.id].length/tot));out=out.concat(weighted(per[t.id],k))});
  out=shuffle(out);
  if(out.length>n)out=out.slice(0,n);
  if(out.length<n){const rest=shuffle(BANK.filter(q=>!out.includes(q)));out=out.concat(rest.slice(0,n-out.length))}
  return out;
}
function tick(){
  if(!S||!S.deadline||view!=="quiz")return;
  const left=Math.max(0,S.deadline-Date.now());
  const el=$("#timer");if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");el.classList.toggle("low",left<5*60000)}
  if(left<=0)finish();
}

     ${S.deadline?`<span class="timer" id="timer">--:--</span>`:(S.mode==="topic"?"":`<span class="chip">${esc(S.title)}</span>`)}</div>`;
  const pr=`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.idx+1}"><i style="width:${100*(S.idx+(showFb?1:0))/n}%"></i></div>`;
  let nav="";
  if(S.feedback){
    nav=`<div class="row"><button class="btn" type="button" data-act="next" ${answered?"":"disabled"}>${S.idx===n-1?"Eredmény":"Következő"}</button><span class="note">${S.idx+1} / ${n} · billentyűk: A–D / 1–4 válasz, Enter tovább</span><button class="btn ghost small" type="button" data-act="quit" style="margin-left:auto">Kilépés</button></div>`;
  }else{
    const grid=S.items.map((x,i)=>`<button type="button" data-act="goto" data-i="${i}" class="${x.ans!==null?"done":""} ${i===S.idx?"cur":""}" aria-label="${i+1}. kérdés${x.ans!==null?", megválaszolva":""}">${i+1}</button>`).join("");
    const unans=S.items.filter(x=>x.ans===null).length;
    nav=`<div class="qgrid">${grid}</div>
      <div class="row"><button class="btn ghost" type="button" data-act="prev" ${S.idx===0?"disabled":""}>Előző</button>
      <button class="btn ghost" type="button" data-act="next" ${S.idx===n-1?"disabled":""}>Következő</button>
      <button class="btn" type="button" data-act="finish" style="margin-left:auto">Beadás${unans?` (${unans} üres)`:""}</button></div>`;
  }
  return `<section class="card" style="display:flex;flex-direction:column;gap:16px">${head}${pr}<div class="qtext">${S.idx+1}. ${esc(q.q)}</div><div class="opts" role="group" aria-label="Válaszlehetőségek">${opts}</div>${fb}${nav}</section>`;
}
function pick(oi){
  const it=S.items[S.idx];
  if(S.feedback){
    if(it.ans!==null)return;
    it.ans=oi;const ok=oi===0;rec(it.q,ok);
    if(!ok&&!S.retried[it.q.id]){S.retried[it.q.id]=1;const c=prep(it.q);c.retry=true;S.items.push(c)}
  }else{it.ans=oi}
  render(true);
}
function next(){
  if(S.feedback){
    if(S.items[S.idx].ans===null)return;
    if(S.idx>=S.items.length-1)return finish();
    S.idx++;render();
  }else if(S.idx<S.items.length-1){S.idx++;render()}
}
function finish(){
  if(!S||S.done)return;S.done=true;
  if(timerId){clearInterval(timerId);timerId=null}
  if(!S.feedback){S.items.forEach(x=>{if(x.ans!==null)rec(x.q,x.ans===0)})}
  const base=S.items.filter(x=>!x.retry);
  const correct=base.filter(x=>x.ans===0).length;
  S.result={n:base.length,correct,mins:Math.round((Date.now()-S.start)/60000)};
  store.hist.push({t:Date.now(),mode:S.mode,n:base.length,c:correct});if(store.hist.length>200)store.hist.shift();save();
  setView("result");
}
function gradeOf(p){return p>=88?5:p>=76?4:p>=63?3:p>=48?2:1}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="nav"){tab=b.dataset.v;if(S&&S.deadline&&!S.done){/* futó szimuláció megszakad */ S=null}setView(b.dataset.v==="home"?"home":b.dataset.v)}
  else if(a==="start"){
    start(b.dataset.mode,b.dataset.t);
  }
  else if(a==="pick")pick(+b.dataset.oi);
  else if(a==="next")next();
  else if(a==="prev"){if(S.idx>0){S.idx--;render()}}
  else if(a==="goto"){S.idx=+b.dataset.i;render()}
  else if(a==="finish")finish();
  else if(a==="quit"){if(S&&S.items.some(x=>x.ans!==null)){finish()}else{S=null;setView("home")}}
  else if(a==="reset1"){
    const bt=$("#resetBtn");
    if(bt.dataset.armed){store={stats:{},hist:[]};save();bt.dataset.armed="";$("#resetNote").textContent="A haladás törölve.";bt.textContent="Haladás törlése"}
    else{bt.dataset.armed="1";bt.textContent="Biztosan törlöd? Kattints újra";$("#resetNote").textContent="Ez a művelet nem vonható vissza."}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="simN"){simN=+e.target.value;try{localStorage.setItem(LS_KEY+"-n",String(simN))}catch(_){}}});
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!S||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="select"||tag==="input")return;
  const k=e.key.toLowerCase();let pos=-1;
  if("1234".includes(k)&&k.length===1)pos=+k-1;else if("abcd".includes(k)&&k.length===1)pos=k.charCodeAt(0)-97;
  if(pos>=0){const it=S.items[S.idx];pick(it.order[pos]);e.preventDefault();return}
  if(k==="enter"||k==="arrowright"){if(tag==="button"&&k==="enter"&&e.target.dataset.act)return;next();e.preventDefault()}
  else if(k==="arrowleft"&&!S.feedback&&S.idx>0){S.idx--;render()}
});
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement,cur=r.dataset.theme||"auto",nx=cur==="auto"?"dark":cur==="dark"?"light":"auto";
  if(nx==="auto")delete r.dataset.theme;else r.dataset.theme=nx;
  try{localStorage.setItem(LS_THEME,nx)}catch(_){}
  $("#themeBtn").textContent="◐ "+({auto:"téma: auto",dark:"téma: sötét",light:"téma: világos"})[nx];
});
try{const th=localStorage.getItem(LS_THEME);if(th&&th!=="auto"){document.documentElement.dataset.theme=th;$("#themeBtn").textContent="◐ téma: "+(th==="dark"?"sötét":"világos")}}catch(_){}
render();
