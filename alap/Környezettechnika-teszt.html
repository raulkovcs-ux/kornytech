<style>
/* Layout: egyoszlopos laborjegyzőkönyv-hangulat, felül a kérdéssáv (mint az eredeti teszt számozott fülei), alatta a kérdéskártya. */
:root {
  --bg: #F2F6F7;
  --surface: #FFFFFF;
  --ink: #102A30;
  --muted: #566D74;
  --line: #D3DFE2;
  --accent: #0B7A85;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1F1F3;
  --good: #1B7F4B;
  --good-bg: #E3F4EA;
  --bad: #B3392F;
  --bad-bg: #FBE9E7;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0C1A1E;
  --surface: #132429;
  --ink: #E6F0F2;
  --muted: #93AAB0;
  --line: #264047;
  --accent: #4CC3CF;
  --accent-ink: #06262A;
  --accent-soft: #14343A;
  --good: #5FD08F;
  --good-bg: #12301F;
  --bad: #FF8A7F;
  --bad-bg: #3A1B18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.theme-btn {
  font: inherit; font-size: 13px; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 6vw, 44px); line-height: 1.08; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 3.6vw, 25px); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.group-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* beállítások */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.chip span {
  display: inline-flex; gap: 8px; align-items: baseline; padding: 8px 12px; border: 1.5px solid var(--line);
  border-radius: 6px; font-size: 15px; background: var(--surface);
}
.chip span small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

.btn {
  font: inherit; font-weight: 600; font-size: 15px; border-radius: 6px; padding: 11px 18px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* kérdéssáv */
.strip { display: flex; gap: 2px; }
.strip i { flex: 1; height: 6px; min-width: 0; border-radius: 1px; background: var(--line); }
.strip i.ok { background: var(--good); }
.strip i.bad { background: var(--bad); }
.strip i.cur { background: var(--accent); }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* válaszok */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; min-height: 48px;
}
.opt .key { font-family: var(--font-mono); font-size: 12px; width: 24px; height: 24px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); margin-top: 1px; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
@media (hover: hover) { .opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); } }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .6; }
.feedback { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 4px; }
.feedback.ok { border-color: var(--good); }
.feedback.bad { border-color: var(--bad); }
.feedback strong { font-weight: 600; }
.feedback .why { color: var(--muted); font-size: 15px; }

/* eredmény */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font-family: var(--font-display); font-size: clamp(52px, 12vw, 84px); line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score span { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
.missed { display: flex; flex-direction: column; gap: 14px; }
.miss { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.miss .q { font-weight: 600; }
.miss .yours { color: var(--bad); font-size: 15px; }
.miss .right { color: var(--good); font-size: 15px; }
.miss .note { color: var(--muted); font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); max-width: 64ch; }
@media (prefers-reduced-motion: no-preference) {
  .bar > div { transition: width .5s ease; }
}
</style>

    "Nagyobb sebességnél nagyobb a centrifugális erő, a kisebb szemcséket is leválasztja, de a súrlódás és az örvénylés miatt nő az áramlási ellenállás, vagyis a nyomásesés."),

  Q(3, "Melyik sor igaz a porleválasztó ciklonokra?", "Nem tartalmaznak forgó alkatrészeket.",

  Q(3, "Mely légszennyező anyagok azok, amelyek kifejezetten károsak az ózonrétegre?", "CFC-k és HCFC-k",

  Q(3, "Melyik sor tartozik a Claus eljáráshoz?", "Kén-hidrogén átalakítása elemi kénné",

    ["Magas páratartalom és alacsony UV intenzitás", "Magas kén-dioxid koncentráció és ózonképződés", "Alacsony hőmérséklet és kénsavképződés"],
    "A fotokémiai szmog a közlekedés nitrogén-oxidjaiból és szénhidrogénjeiből alakul ki erős napsugárzás és meleg időjárás hatására, másodlagos szennyezőként ózon keletkezik."),
  Q(3, "Az alábbi gázok ún. GWP értékei alapján melyik a helyes sorrend?", "CO2 < CH4 < CF4",
    ["CH4 < CF4 < CO2", "CH4 < CO2 < CF4", "CO2 = CH4 < CF4"],
    "A CO2 a viszonyítási alap (GWP = 1), a metán ennél nagyobb, a CF4 pedig sokszorosa mindkettőnek."),
  Q(3, "Milyen hullámhosszú sugárzás formájában sugározza ki a napfényből elnyelt energiát a földfelszín?", "Az elnyelt sugárzásnál számottevően nagyobb hullámhosszú sugárzás formájában",
    ["Az elnyelt sugárzásnál számottevően kisebb hullámhosszú sugárzás formájában", "Nem sugároz ki energiát a földfelszín", "Egyáltalán nem változik a hullámhossz"],
    "A földfelszín hosszabb hullámhosszú (infravörös) sugárzást bocsát ki, ezt nyelik el az üvegházhatású gázok."),
  Q(3, "Milyen Dobson egység alatt beszélünk \"ózonlyuk\"-ról?", "220",
    ["A Dobson egységnek nincs köze az ózonlyuk definíciójához", "360", "400"],
    "Az ózonlyuk szokásos határa 220 Dobson-egység alatti teljes ózonoszlop."),
  Q(3, "Melyik állítás igaz az ózonréteg vonatkozásában?", "Az ózonréteg képes elnyelni az UV-B sugárzás jelentős részét.",
    ["Az ózonréteg képes elnyelni az UV-A sugárzás jelentős részét.", "Az ózonréteg regenerálódását elősegíti az ún. CFC-k magas koncentrációja.", "Az ózonréteg regenerálódásához UV-A fotonokra van szükség."]),
  Q(3, "Fejezze be helyesen a mondatot: A porlepítő kamrákban ...", "változatlan térfogatáramlási, de kisebb lineáris áramlási sebesség mellett történik a porszemcsék gravitációs ülepítése.",
    ["változatlan lineáris-, de kisebb térfogatáramlási sebesség mellett történik a porszemcsék gravitációs ülepítése.", "centrifugális erő segítségével érjük el a porszemcsék leválasztását.", "textilszövet segítségével szűrjük ki a porszemcséket."],
    "A kamra nagy keresztmetszete miatt a gáz sebessége lecsökken, így a szemcsék a gravitáció hatására leülepednek."),
  Q(3, "Melyik a helyes sorrend a levegő összetételének a vonatkozásában?", "nitrogén - oxigén - argon - szén-dioxid",
    ["oxigén - nitrogén - szén-dioxid - argon", "nitrogén - oxigén - szén-dioxid - argon", "oxigén - nitrogén - argon - szén-dioxid"],
    "A száraz levegő térfogatának kb. 78%-a nitrogén, 21%-a oxigén, kb. 0,9%-a argon, a szén-dioxid pedig néhány század százalék."),
  Q(3, "Milyen hozzáadott gázra van szükség az ún. \"HDS\" technológia alkalmazása során?", "Hidrogénre",
    ["Szén-dioxidra", "Oxigénre", "Nitrogénre"], "A HDS (hidrodeszulfurizálás) hidrogén segítségével távolítja el a ként."),
  Q(3, "Melyik sor tartozik az ún. \"HDS\" technológiához?", "Kőolajszármazékok hidrogénező katalitikus kéntelenítése",
    ["Kőolajszármazékok nem-katalitikus kezelése a kén- és nitrogéntartalom csökkentése érdekében", "Kőolajszármazékok nitrogéntartalmának hidrogénező katalitikus csökkentése", "Kőolajszármazékok kéntelenítése szobahőmérsékleten zöldkémiai módszerekkel"],
    "A HDS a Hydrodesulfurization rövidítése: katalizátor jelenlétében, hidrogén segítségével távolítják el a ként a kőolajtermékekből."),

  /* ---- Negyedik teszt ---- */
  Q(4, "Mely elemek kationjai okozzák a vizek keménységét?", "Ca, Mg", ["Fe, As", "Fe, Mn", "As, Ca"],
    "A víz keménységét a kalcium- és magnéziumionok okozzák."),
  Q(4, "Mit jelent a flokkuláció?", "A destabilizált (koagulált) részecskék pelyhesítését jelenti a vízkezelés során",
    ["A stabilizált részecskék felúsztatását jelenti a vízkezelés során buborékoltatással", "A stabilizált és nem stabilizált részecskék felúsztatását jelenti a vízkezelés során buborékoltatással", "Lebegőanyagok felúsztató-ciklonnal történő leválasztását jelenti a vízkezelés során"],
    "Előbb a koaguláció destabilizálja a részecskéket, utána a flokkuláció során pelyhekké állnak össze."),
  Q(4, "Melyek a víz ún. organoleptikus tulajdonságai?", "szín, íz, szag",
    ["TOC, KOI, BOI", "szag, íz, pH", "zavarosság, vezetőképesség, szín"],
    "Az organoleptikus tulajdonságokat az érzékszerveinkkel közvetlenül érzékeljük: látás, ízlelés, szaglás."),
  Q(4, "Mit jelent a koaguláció?", "Destabilizálást jelent, a vízben úszó részecskék töltéssemlegesítése révén.",
    ["Stabilizációt jelent a pH-nak a fémionokkal történő semlegesítése révén.", "Stabilizálást jelent, a vízben úszó részecskék felületi töltésének növelése révén.", "Stabilizációt jelent a vízkezelésben, az oldott oxigénszint emelésével."],
    "A kolloid részecskék azonos töltésűek, ezért taszítják egymást. A koagulálószer semlegesíti a töltésüket, így összetapadhatnak."),
  Q(4, "Melyik sorban lát valós szivattyú-típusokat?", "radiális és axiális",
    ["radikális és emulzionális", "axiális és szuszpenzionális", "szuszpenzionális és harántáramú"],
    "Valós szivattyú-típus a radiális és az axiális. A szuszpenzió és az emulzió fázisrendszer, nem szivattyú."),
  Q(4, "Mennyi a magyarországi ivóvizek maximális megengedett arzéntartalma?", "10 µg/L",
    ["50 µg/L", "50 mg/L", "10 mg/L"], "A megengedett határérték 10 µg/L. Figyelj a mértékegységre: a mg/L ezerszer nagyobb."),
  Q(4, "Jellemzően mely elemek ionjai eredményezhetnek kellemetlen ízt az ivóvízben?", "Fe, Mn", ["Ca, Mg", "Mg, Na", "Na, Ca"],
    "A vas- és mangánionok az ivóvíz kellemetlen ízét okozhatják."),
  Q(4, "Melyik három módszerrel lehet jellemezni a vizek szervesanyag-tartalmát?", "KOI, BOI, TOC",
    ["TOC, NTU, BOI", "TOC, KOI, TIC", "pH, TOC, BOI"], "KOI: kémiai oxigénigény, BOI: biokémiai oxigénigény, TOC: teljes szerves széntartalom."),
  Q(4, "Melyik szennyezőhöz kapcsolódik a methemoglobinémia?", "nitrit", ["higany", "DDT", "arzén"],
    "A nitrát a szervezetben nitrittá alakulhat. A nitrit a hemoglobin vasát oxidálja, a keletkező methemoglobin nem képes oxigént szállítani (csecsemőknél „kékhalál”)."),
  Q(4, "Melyik sor tartozik a vizek zavarosságának a méréséhez/jellemzéséhez?", "NTU", ["KOI", "TOC", "pH"],
    "Az NTU a nefelometrikus zavarossági egység (Nephelometric Turbidity Unit).")
];

const KEYS = ["A", "B", "C", "D"];
const app = document.getElementById("app");
let st = { queue: [], i: 0, results: [], locked: false };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") el.className = attrs[k];
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) el.setAttribute(k, "");
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) el.append(c instanceof Node ? c : document.createTextNode(c));
  return el;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function prep(item) {
  const opts = shuffle([item.correct, ...item.wrong]);
  return { ...item, opts, a: opts.indexOf(item.correct) };
}

/* ---- kezdőképernyő ---- */
function showStart() {
  const counts = {};
  BANK.forEach(b => counts[b.t] = (counts[b.t] || 0) + 1);
  const boxes = {};
  const chips = Object.keys(TESTS).map(k => {
    const inp = h("input", { type: "checkbox", id: "test-" + k, checked: true, onchange: update });
    boxes[k] = inp;
    return h("label", { class: "chip" }, inp, h("span", {}, TESTS[k], h("small", {}, counts[k])));
  });
  const shuf = h("input", { type: "checkbox", id: "shuffle", checked: true });
  const go = h("button", { class: "btn", type: "button", id: "startBtn", onclick: () => {
    start(BANK.filter(b => boxes[b.t].checked), shuf.checked);
  } }, "Teszt indítása");
  function update() {
    const n = BANK.filter(b => boxes[b.t].checked).length;
    go.disabled = n === 0;
    go.textContent = n ? `Teszt indítása (${n} kérdés)` : "Válassz legalább egy tesztet";
  }
  app.replaceChildren(
    h("div", { class: "card" },
      h("h1", {}, "Környezettechnika-teszt"),
      h("p", { class: "lead" }, `${BANK.length} feleletválasztós kérdés négy tesztből: víz és vízkezelés, szennyezők, levegőtisztaság, ózonréteg, szeparációs és ipari eljárások. Minden válasz után megkapod a helyes megoldást.`),
      h("div", {},
        h("div", { class: "group-label", style: "margin-bottom:10px" }, "Tesztek"),
        h("div", { class: "chips" }, chips)),
      h("label", { class: "switch", for: "shuffle" }, shuf, "Kérdések sorrendjének keverése"),
      h("div", { class: "actions" }, go)));
  update();
}

function start(items, doShuffle) {
  const list = doShuffle ? shuffle(items) : items.slice();
  st = { queue: list.map(prep), i: 0, results: [], locked: false };
  showQuestion();
}

/* ---- kérdés ---- */
function strip() {
  return h("div", { class: "strip", "aria-hidden": "true" }, st.queue.map((_, i) => {
    const r = st.results[i];
    return h("i", { class: r ? (r.ok ? "ok" : "bad") : (i === st.i ? "cur" : "") });
  }));
}
function showQuestion() {
  const item = st.queue[st.i];
  st.locked = false;
  const fb = h("div", { "aria-live": "polite" });
  const nextBtn = h("button", { class: "btn", type: "button", id: "nextBtn", hidden: true, onclick: next },
    st.i === st.queue.length - 1 ? "Eredmény megtekintése" : "Következő kérdés");
  const btns = item.opts.map((o, idx) =>
    h("button", { class: "opt", type: "button", "data-i": idx, onclick: () => answer(idx) },
      h("span", { class: "key" }, KEYS[idx]), h("span", { class: "txt" }, o)));

  function answer(idx) {
    if (st.locked) return;
    st.locked = true;
    const ok = idx === item.a;
    st.results[st.i] = { ok, chosen: item.opts[idx], item };
    btns.forEach((b, j) => {
      b.disabled = true;
      if (j === item.a) b.classList.add("correct");
      else if (j === idx) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    fb.replaceChildren(h("div", { class: "feedback " + (ok ? "ok" : "bad") },
      h("strong", {}, ok ? "Helyes." : "Nem talált."),
      item.why ? h("p", { class: "why" }, item.why) : ""));
    nextBtn.hidden = false;
    nextBtn.focus();
    app.querySelector(".strip").replaceWith(strip());
  }
  btns.forEach(b => b._answer = answer);
  app._btns = btns;

  app.replaceChildren(
    h("div", { class: "card" },
      strip(),
      h("div", { class: "meta" }, h("span", {}, `${st.i + 1} / ${st.queue.length}`), h("span", {}, TESTS[item.t])),
      h("h2", {}, item.q),
      h("div", { class: "opts", role: "group", "aria-label": "Válaszlehetőségek" }, btns),
      fb,
      h("div", { class: "actions" }, nextBtn)));
}
function next() {
  if (st.i < st.queue.length - 1) { st.i++; showQuestion(); window.scrollTo({ top: 0 }); }
  else showResult();
}

/* ---- eredmény ---- */
function showResult() {
  app._btns = null;
  const total = st.queue.length;
  const good = st.results.filter(r => r && r.ok).length;
  const pct = Math.round(good / total * 100);
  const missed = st.results.filter(r => r && !r.ok);
  const bar = h("div", { class: "bar", role: "img", "aria-label": pct + " százalék" }, h("div", { style: "width:0%" }));
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.firstChild.style.width = pct + "%"; }));
  app.replaceChildren(
    h("div", { class: "card" },
      h("div", { class: "eyebrow" }, "Eredmény"),
      h("div", { class: "score" }, h("b", {}, `${good}/${total}`), h("span", {}, pct + "%")),
      bar,
      h("p", { class: "lead" }, missed.length === 0 ? "Hibátlan teszt." : `${missed.length} kérdésre nem a helyes választ adtad. Lent átnézheted őket.`),
      h("div", { class: "actions" },
        missed.length ? h("button", { class: "btn", type: "button", onclick: () => start(missed.map(m => m.item), true) }, "Hibás kérdések újra") : "",
        h("button", { class: "btn ghost", type: "button", onclick: showStart }, "Új teszt")),
      missed.length ? h("div", { class: "missed" }, missed.map(m =>
        h("div", { class: "miss" },
          h("p", { class: "q" }, m.item.q),
          h("p", { class: "yours" }, "Te ezt választottad: " + m.chosen),
          h("p", { class: "right" }, "Helyes válasz: " + m.item.correct),
          m.item.why ? h("p", { class: "note" }, m.item.why) : ""))) : ""));
  window.scrollTo({ top: 0 });
}

/* ---- billentyűk ---- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const btns = app._btns;
  if (!btns || !document.querySelector(".opts")) return;
  const k = e.key.toLowerCase();
  let idx = -1;
  if (k.length === 1) idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (idx >= 0 && idx < btns.length && !st.locked) btns[idx]._answer(idx);
  else if (st.locked && (e.key === "ArrowRight" || (e.key === "Enter" && document.activeElement === document.body))) { e.preventDefault(); next(); }
});

/* ---- téma (alapértelmezett: világos) ---- */
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");
function setTheme(t) {
  if (t === "dark") root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
  themeBtn.textContent = t === "dark" ? "Világos téma" : "Sötét téma";
}
let saved = null;
try { saved = localStorage.getItem("kt-theme"); } catch (e) {}
setTheme(saved === "dark" ? "dark" : "light");
themeBtn.addEventListener("click", () => {
  const t = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  setTheme(t);
  try { localStorage.setItem("kt-theme", t); } catch (e) {}
});

showStart();
</script>

</body></html>
